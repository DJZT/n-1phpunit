name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', laravel: '^10.0', phpunit: '^10.5' }
          - { php: '8.2', laravel: '^10.0', phpunit: '^10.5' }
          - { php: '8.2', laravel: '^11.0', phpunit: '^11.0' }
          - { php: '8.3', laravel: '^11.0', phpunit: '^11.0' }
          - { php: '8.3', laravel: '^12.0', phpunit: '^12.0' }
          - { php: '8.4', laravel: '^12.0', phpunit: '^12.0' }
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / PHPUnit ${{ matrix.phpunit }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none

      - name: Pin the matrix versions
        run: |
          composer require --no-update --no-interaction \
            "phpunit/phpunit:${{ matrix.phpunit }}"
          composer require --dev --no-update --no-interaction \
            "illuminate/database:${{ matrix.laravel }}" \
            "illuminate/events:${{ matrix.laravel }}"

      - run: composer update --no-interaction --prefer-dist

      - run: vendor/bin/phpunit --no-coverage
